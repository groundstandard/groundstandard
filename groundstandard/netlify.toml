[build]
  command = "npm run build"
  publish = "dist"

# The embed script on client sites. It shipped with max-age=0, so every visitor
# paid a full round trip for it on every page — the form could not appear for
# about a second. Five minutes of browser cache removes that, and
# stale-while-revalidate keeps a stale copy usable for a day while the fresh one
# is fetched in the background.
#
# Deliberately short. Pinning a copy of a form script into a site for a long time
# is exactly what went wrong in July; what changes often is the form definition,
# and that is read from the database on every load regardless.
[[headers]]
  for = "/form.js"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[edge_functions]]
  path = "/img/*"
  function = "share-image"

# Proxy the same path you use locally to the n8n cloud webhook in production
[[redirects]]
  from = "/api/rewrite"
  to = "https://groundstandard.app.n8n.cloud/webhook/rewrite"
  status = 200
  force = true

[[redirects]]
  from = "/api/research"
  to = "https://groundstandard.app.n8n.cloud/webhook/Research"
  status = 200
  force = true

[[redirects]]
  from = "/api/write"
  to = "https://groundstandard.app.n8n.cloud/webhook/Write"
  status = 200
  force = true

[[redirects]]
  from = "/api/tag"
  to = "https://groundstandard.app.n8n.cloud/webhook/Tag"
  status = 200
  force = true

[[redirects]]
  from = "/api/chat-bot"
  to = "https://groundstandard.app.n8n.cloud/webhook/chat-bot"
  status = 200
  force = true

[[redirects]]
  from = "/api/video-caption"
  to = "https://primary-production-aa130.up.railway.app/webhook/video-caption"
  status = 200
  force = true

[[redirects]]
  from = "/api/image-batch"
  to = "https://primary-production-aa130.up.railway.app/webhook/image-batch"
