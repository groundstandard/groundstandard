[build]
  command = "npm run build"
  publish = "dist"

[[edge_functions]]
  path = "/img/*"
  function = "share-image"

# Proxy the same path you use locally to the n8n cloud webhook in production
[[redirects]]
  from = "/api/rewrite"
  to = "https://primary-production-aa130.up.railway.app/webhook/rewrite"
  status = 200
  force = true

[[redirects]]
  from = "/api/research"
  to = "https://primary-production-aa130.up.railway.app/webhook/Research"
  status = 200
  force = true

[[redirects]]
  from = "/api/write"
  to = "https://primary-production-aa130.up.railway.app/webhook/Write"
  status = 200
  force = true

[[redirects]]
  from = "/api/tag"
  to = "https://primary-production-aa130.up.railway.app/webhook/Tag"
  status = 200
  force = true

[[redirects]]
  from = "/api/chat-bot"
  to = "https://primary-production-aa130.up.railway.app/webhook/chat-bot"
  status = 200
  force = true

[[redirects]]
  from = "/api/video-caption"
  to = "https://primary-production-aa130.up.railway.app/webhook/video-caption"
  status = 200
  force = true

[[redirects]]
  from = "/api/image-batch"
  to = "https://primary-production-aa130.up.railway.app/webhook/image-batch"
  status = 200
  force = true

[[redirects]]
  from = "/api/image"
  to = "https://groundstandard.app.n8n.cloud/webhook/image"
  status = 200
  force = true

[[redirects]]
  from = "/api/scrapper"
  to = "https://groundstandard.app.n8n.cloud/webhook/scrapper"
  status = 200
  force = true

# /img/* is handled by Netlify Edge Function (share-image.ts)
# Serves OG meta tags for social media crawlers, proxies actual image for browsers

# Raw image redirect — Facebook follows 302 to fetch image directly from Supabase
[[redirects]]
  from = "/raw-img/*"
  to = "https://qkwiauivaerrrbemdlyj.supabase.co/storage/v1/object/public/image-content/:splat"
  status = 302
  force = true

# SPA fallback — serve index.html for client-side routes (must stay LAST)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
